[pytest]
; ARQ-260916-unit-gate-archive-recursion：归档件（acceptance/archive/）是 sweep 77b6b0c 退役面，
; 裸 pytest 递归收集会踩 121F 假红（归档件引用已退役 server 产物）。norecursedirs 整项覆写
; pytest 默认值，故保留默认形态 + archive。注意：显式传参文件不受 norecursedirs 约束（pytest
; 既定行为），闸侧显式传参路由 unit-run-check.mjs 枚举跳过承载。
norecursedirs = .* _darcs build CVS dist node_modules venv {arch} archive
markers =
    acceptance: 冻结验收（live ECS，需 SSH 到 8.137.91.16 + 环境变量）
    live: live on-target 验收（需 SSH/凭据，merge 环境只做结构闸、不 auto-run）