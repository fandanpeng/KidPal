# KidPal direction-B gateway provider declarations (GWA-A4 / 决策18 / 决策19).
#
# This file is the machine-readable *declaration* of the three required provider
# families, rendered onto the ECS xiaozhi-esp32-server config overlay
# (data/.config.yaml under /opt/kidpal/xiaozhi-esp32-server/deploy/xiaozhi-docker-data)
# at deploy time by server/deploy/apply-xiaozhi-overlay.sh. Credentials are injected
# from server/deploy/secrets.env at render time — never hard-coded here.
#
# Contract §四 / V9 hard constraint: the streaming request to OpenClaw MUST NOT carry
# max_tokens (实测触发 agent incomplete-turn). see provider.openclaw_stream_request.

gateway:
  name: "xiaozhi"                       # systemd unit name (GATEWAY_SERVICE)
  deploy_source: "/opt/kidpal/xiaozhi-esp32-server"
  wss_port: 8000                        # device leg (wss://<ecs>:8000/xiaozhi/v1/)
  # 18789 锁 127.0.0.1 (V28 硬前置): OpenClaw brain loopback-only.
  openclaw_loopback: "http://127.0.0.1:18789"
  openclaw_loopback_lock: "127.0.0.1:18789"
  wss_cert: "/opt/kidpal/xiaozhi-esp32-server/cert/server.pem"
  wss_key: "/opt/kidpal/xiaozhi-esp32-server/cert/server.key"

# OpenClaw brain system prompt (VRT-E4 / VRT-A7). 本文件是 OpenClaw 大脑的
# system prompt 唯一生成来源，随 overlay 上 ECS 并作为 live 遵循度/问答探针
# (VRT-A4 / VRT-A7) 的唯一 prompt 源 —— 「验收所测 = 生产所用」。落盘与渲染:
# apply-xiaozhi-overlay.sh 将其渲染到 ECS data 目录; 版本化 .v1/.v2/.v3 切换即换。
system_prompt:
  artifact: "openclaw-system-prompt.v10.md"   # 当前版本化文件 (v10 = 261012-kidpal-realtime-facts:
                                             #   回合路由表新增「实时事实回合」行（先播提示→联网真查→只依据
                                             #   查询结果作答、查不到诚实引导、禁编造/禁虚称已查）+ 对话行通用
                                             #   反编造 + 底线节第三不变量（TECH-261012 真机天气幻觉根治）)
  source: "../deploy/openclaw-system-prompt.v10.md"
  deploy_target: "openclaw-system-prompt.v10.md"   # ECS data/ 下的渲染目标名
  # 演进史唯一全量副本 = OPENCLAW_SYSTEM_PROMPT_CARRIER（声明面 / 渲染面 / 本文件三处散文
  # 一律只留「当前 = vN」指针，不再复述沿革）。三处接线（本声明面 / apply-xiaozhi-overlay.sh
  # 渲染面 / carrier 载体）指向同一在场非空文件；一致性由 ADR-001 版本无关守卫 +
  # test_prompt_v7_round_routing.acceptance.py 语义锚齿机检。历史版本文件一律不改、可 diff。
  # 结构: 回合类型路由表（对话=一回合作答禁工具 / 查字=最小意图块绝对禁工具 /
  # 课表问答=先读 schedule.md+反编造 / 实时事实=先播提示→联网真查→只依据查询结果作答+
  # 查不到诚实引导 / 提醒 cron=语义 JSON；家长 QQ 录入走家庭侧 agent、不入表）
  # + 两部分回复 (先口语儿童答案 + 末尾 ```display 块, 契约 §1.6)
  # + 语音简洁不啰嗦（v7 放宽硬性三句，human 260925 裁；讲故事按段落讲不逐段请示）
  # + 7 view 白名单 + 课表/查字/故事/提醒各域节 (查字最小意图块禁坐标 /
  # 故事禁产 story JSON / 提醒 entry_key 对齐)。

# 提醒三档阶梯配置 (260829-schedule-reminder / RMD-A2 / 决策 20): 时刻的家在**服务端**，
# 纯配置不进契约 B1、不进固件（改时刻即时生效、永不烧板子）。消费方 = OpenClaw cron 载荷
# 脚本 server/deploy/openclaw-patch/reminder_schedule_lib.py::load_ladder_config；铺放面 =
# server/deploy/manifest.yaml 登记、deploy.sh 直管消费位
# /opt/kidpal/openclaw-reminder.config.yaml（261013-gov-review-deploy-single-source-loop，
# 原写「渲染面 = apply-xiaozhi-overlay.sh」——该渲染落 $DATA_DIR 非消费位，已废）；
# 缺文件回退脚本内 DEFAULT_LADDER_CONFIG。
reminder_config:
  artifact: "openclaw-reminder.config.yaml"
  source: "../deploy/openclaw-reminder.config.yaml"
  ladder: {night_at: "20:30", morning_at: "07:45", before_min: 15}
  handoff: "alerts/pending.json"      # 同机交接（env 可配 KIDPAL_ALERTS_DIR/KIDPAL_PENDING_JSON）
  consumer: "openclaw-patch/reminder_schedule_lib.py"   # 三档算术 + 幂等 id + 原子写
  deliverer: "gateway/reminders.py"                     # 每分钟轮询 + 重试到确认 60s×3 + 静默作废

# 引擎连接超时（决策 21 / arch §6.4）: 引擎不主动断连——两道超时 24h 纯兜底 + 告别语关闭，
# 保「设备常驻在线（提醒推送可达）」假设。渲染面 = apply-xiaozhi-overlay.sh heredoc 顶层两键。
# 病史：260914 修正曾只落活配置（无渲染面），260930/1001 overlay 再生即丢 → 告别语复活 +
# 120/180s 断连（TECH-261010-engine-decision21-keys-not-persistent）；本块 = 声明面持久化，
# 机检齿 = test_261010_engine_decision21_overlay_persist.acceptance.py。
engine_timeout:
  close_connection_no_voice_time: 86400   # 24h 纯兜底（引擎源码默认 120，勿回落）
  end_prompt:
    enable: false                          # 告别语关闭（引擎源码默认 true，勿回落）

providers:
  llm:
    family: "llm"
    provider: "openai"                  # type:openai 流式接 OpenClaw
    target: "openclaw"                  # OpenClaw OpenAI-compatible endpoint
    base_url: "http://127.0.0.1:18789/v1"  # loopback (V28); /v1 required (live 260906: without it engine hits 404)
    model: "openclaw/kidpal"
    stream: true
    forbid_max_tokens: true             # 契约 §四 / V9 硬约束
  tts:
    family: "tts"
    # provider value must match the engine provider module filename (edge, not edge-tts)
    # — live 260905 lesson: edge-tts.py does not exist -> "不支持的TTS类型".
    provider: "edge"                    # edge-tts 下行 (venv 3.11 已装 edge-tts 7.2.8)
    voice: "zh-CN-XiaoxiaoNeural"
  asr:
    family: "asr"
    provider: "qwen3_asr_flash"        # Qwen3ASRFlash, DashScope 流式 — human 2026-09-06 ASR 终选
                                       # (spec §A1 双候选之一; 决策19 云优先; V23 降级链见下)
    candidate_stream: true             # 候选流式 + VAD 切句兼容性实测 (V23)
    api_key_env: "DASHSCOPE_API_KEY"   # DashScope 流式 ASR 凭据 (secrets.env 已用该名)
    model_name: "qwen3-asr-flash"
    # 定谳指针 (S0.3): human 2026-09-06 ASR 终选 Qwen3ASRFlash; 2026-09-11 S0.3 D5/D6 裁决
    # pod-events b22e2019/d41a2f74 (auth.enabled 恢复声明终态 true; 补渲 server.ip/port)。
    # 若凭据不可得: live ASR 标缺口升级 (human 待办), 结构面按可声明形状实现, 不伪造.
    downgrade_chain: ["fun_asr-server -> sensevoice", "aliyun_nonsream", "aliyun_stream"]