# ── openclaw cron 作业（verify-only：命令串/归属/trigger 核验，铺放走 openclaw CLI 不在本批面）──
# trigger 核验（261031）：凡登记 expect_trigger_file 的 job，verify-deploy.sh 会比对
# job.trigger.script 与盘上文件（行尾归一后逐字）、守卫 trigger.once 不得为 true、
# 并守卫全局 cron.triggers.enabled 不得为 false。
cron_jobs:
  - name: kidpal-reminder-plan
    expect_argv: "KIDPAL_SERVER_DIR=/opt/kidpal/front KIDPAL_SCHEDULE_MD=/root/.openclaw/workspace/kidpal/schedule.md KIDPAL_ALERTS_DIR=/opt/kidpal/alerts KIDPAL_SEMANTIC_JSON=/opt/kidpal/alerts/semantic.json /opt/kidpal/venv/bin/python3 /opt/kidpal/openclaw-patch/reminder_schedule_lib.py"
  - name: kidpal-reminder-semantic
    expect_agent: main
    expect_schedule: "every 15m"
    expect_trigger_file: server/deploy/openclaw-patch/triggers/reminder-semantic.trigger.js
  - name: kidpal-schedule-health
    expect_agent: main
    expect_schedule: "every 15m"
    expect_trigger_file: server/deploy/openclaw-patch/triggers/schedule-health.trigger.js
