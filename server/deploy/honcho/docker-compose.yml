# Honcho 自托管记忆栈 — K3-E1（261022-m5-k3-honcho-memory-production）
#
# 261023 修正（部署轮实测发现，nano 批回流）：本文件曾按「Docker Hub 拉镜像五容器
# （api/deriver/app/adminer + 假设镜像 plasticlabs/honcho-app）」声明——实测三处失效：
# plasticlabs/* 镜像上游从不发布（自家 compose 全为 build 源码，app 为托管前端无自
# 托管载体）、api/deriver 缺 DB_CONNECTION_URI 连不上库。本版改回 2026-10-22 探针轮
# 在 ECS 实测验证过的上游拓扑（build 源码 + 五服务 api/deriver/mcp/database/redis +
# DB_CONNECTION_URI 接线 + pgdata 卷数据延续），仅保留 K3 两条硬红线：
#   ① 全部 published 端口显式绑定 127.0.0.1（出网红线，NFR-SEC-2 / arch §5.3.3）；
#   ② 记账锚键（EMBEDDING_VECTOR_DIMENSIONS=1536 / DERIVER_FLUSH_ENABLED /
#      DASHSCOPE_API_KEY 名字引用 / deepseek+dashscope 管线锚）由同目录
#      honcho.env.example 承载（K3-E1 验收树扫描面；真实值在 /opt/honcho/.env，
#      经 env_file 注入容器，不入仓）。
# 运维/查看面：psql 经 127.0.0.1:5432 直连（adminer/app 随错误声明撤除）。
#
# 首铺：bash apply-honcho-stack.sh（缺 /opt/honcho/.env 拒跑）；镜像变更后收敛：
#   docker compose build && docker compose up -d
#
# By default, ports are bound to 127.0.0.1 (localhost only).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LANCEDB: ${INSTALL_LANCEDB:-false}
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18100:8000"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # Shared LanceDB data (used when VECTOR_STORE_TYPE=lancedb)
      - lancedb-data:/app/lancedb_data
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  deriver:
    # 观察抽取器：消费消息队列，LLM 抽 observation（出网管线① → DeepSeek，
    # 凭据经 .env 的 DERIVER_MODEL_CONFIG__* 注入）
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LANCEDB: ${INSTALL_LANCEDB:-false}
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - lancedb-data:/app/lancedb_data
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HONCHO_API_URL=http://api:8000
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # Allow passwordless connections from the host (port is bound to 127.0.0.1).
      # Lets the local test suite and ad-hoc tools connect without supplying a
      # password. Do NOT use this in production.
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redis-data:
  lancedb-data:
